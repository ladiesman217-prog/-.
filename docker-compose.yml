services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: topics
      POSTGRES_USER: topics_user
      POSTGRES_PASSWORD: topics_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topics_user -d topics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      POSTGRES_DSN: postgresql://topics_user:topics_pass@db:5432/topics
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
